services:
  - type: web
    name: ym-core-x
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: YM-CORE X
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /tmp/ym-core.db
      - key: SECURE_COOKIES
        value: "true"
